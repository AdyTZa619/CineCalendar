name: CineCalendar 3.7 Personal Calibration Validation

on:
  push:
    branches: ["feature/personal-calibration-3.7.0"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate 3.7 source tree
        shell: pwsh
        run: |
          $required = @(
            'cinecalendar\accuracy_engine_v37.py',
            'cinecalendar\availability_guard_v37.py',
            'cinecalendar\rolling_backtest_v37.py',
            'cinecalendar\quality_manager_v37.py',
            'cinecalendar\accuracy_ui_v37.py',
            'tests\test_personal_calibration_v370.py',
            'tests\test_availability_guard_v370.py'
          )
          foreach ($p in $required) { if (!(Test-Path $p)) { throw "Missing 3.7 source: $p" } }
          $version = (python -c "from cinecalendar import __version__; print(__version__)").Trim()
          if ($version -ne '3.7.0') { throw "Unexpected version: $version" }

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile sources
        run: python -m compileall -q cinecalendar scripts tests

      - name: Run all tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Benchmark 260k catalog engine
        env:
          PYTHONPATH: .
        run: python scripts/benchmark_engine_v3.py

      - name: Build Windows portable folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CineCalendar --manifest CineCalendar.manifest --hidden-import=sqlite3 --collect-all implicit launcher.py
          $exe = 'dist\CineCalendar\CineCalendar.exe'
          if (!(Test-Path $exe)) { throw 'EXE was not created' }
          $b = [IO.File]::ReadAllBytes($exe)
          if ($b.Length -lt 2 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'Not a Windows PE executable' }

      - name: Smoke launch
        shell: pwsh
        run: |
          $env:CINECALENDAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'cinecalendar-37-smoke'
          $p = Start-Process -FilePath '.\dist\CineCalendar\CineCalendar.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "CineCalendar exited with $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }
