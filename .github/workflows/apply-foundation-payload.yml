name: Apply CineCalendar 3.3 Foundation

on:
  push:
    branches: ["foundation-3.3.0"]
    paths:
      - ".foundation_payload/READY"

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct exact foundation source
        shell: pwsh
        run: |
          $parts = @(Get-ChildItem '.foundation_payload\final*' -File | Sort-Object Name)
          if ($parts.Count -ne 12) { throw "Expected 12 final payload chunks, got $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          if ($b64.Length -ne 58412) { throw "Base64 length mismatch: $($b64.Length)." }
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes('foundation33.tar.gz', $bytes)
          $sha = (Get-FileHash 'foundation33.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'c9b49e24f5d74dd05666b54cafc91a64f61f9b50922f75b1d0c6a4b579d3507b') {
            throw "Foundation archive SHA mismatch: $sha"
          }
          tar -xzf foundation33.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Foundation archive extraction failed.' }
          Remove-Item 'foundation33.tar.gz' -Force

          $fixParts = @(Get-ChildItem '.foundation_payload\fix1*' -File | Sort-Object Name)
          if ($fixParts.Count -ne 3) { throw "Expected 3 fix overlay chunks, got $($fixParts.Count)." }
          $fix64 = ($fixParts | ForEach-Object { (Get-Content -LiteralPath $_.FullName -Raw).Trim() }) -join ''
          if ($fix64.Length -ne 9804) { throw "Fix overlay base64 length mismatch: $($fix64.Length)." }
          $fixBytes = [Convert]::FromBase64String($fix64)
          [IO.File]::WriteAllBytes('foundation33-fix1.tar.gz', $fixBytes)
          $fixSha = (Get-FileHash 'foundation33-fix1.tar.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($fixSha -ne 'ae4c7e93b329a76c988e7162d6e7aac400346c459123e5056199e1aca7e17459') {
            throw "Foundation fix overlay SHA mismatch: $fixSha"
          }
          tar -xzf foundation33-fix1.tar.gz
          if ($LASTEXITCODE -ne 0) { throw 'Foundation fix overlay extraction failed.' }
          Remove-Item 'foundation33-fix1.tar.gz' -Force

          Remove-Item '.foundation_payload' -Recurse -Force
          Remove-Item '.github\workflows\apply-foundation-payload.yml' -Force
          $version = (python -c "from cinecalendar import __version__; print(__version__)").Trim()
          if ($version -ne '3.3.0') { throw "Unexpected candidate version: $version" }
          $required = @(
            'cinecalendar\foundation_v33.py',
            'cinecalendar\single_instance.py',
            'cinecalendar\ui_composition.py',
            'cinecalendar\watch_success_v33.py',
            'tests\test_foundation_v330.py',
            '.github\workflows\foundation-validation.yml'
          )
          foreach ($p in $required) { if (!(Test-Path $p)) { throw "Missing 3.3 source: $p" } }
          if (Test-Path '.foundation_payload') { throw 'Transient foundation payload was not removed.' }

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile all Python sources
        shell: pwsh
        run: |
          python -m compileall -q cinecalendar tests
          if ($LASTEXITCODE -ne 0) { throw 'Python compileall failed.' }

      - name: Run full test suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Benchmark 260k catalog engine
        env:
          PYTHONPATH: .
        run: python scripts/benchmark_engine_v3.py

      - name: Build Windows onedir candidate
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CineCalendar --manifest CineCalendar.manifest --hidden-import=sqlite3 --collect-all implicit launcher.py
          $exe = 'dist\CineCalendar\CineCalendar.exe'
          if (!(Test-Path $exe)) { throw 'CineCalendar.exe was not created.' }
          $b = [IO.File]::ReadAllBytes($exe)
          if ($b.Length -lt 2 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'Not a Windows PE executable.' }
          if (!(Test-Path 'dist\CineCalendar\_internal')) { throw 'PyInstaller _internal folder missing.' }

      - name: Smoke launch candidate
        shell: pwsh
        run: |
          $env:CINECALENDAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'cinecalendar-foundation-smoke'
          $p = Start-Process -FilePath '.\dist\CineCalendar\CineCalendar.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "Candidate exited with $($p.ExitCode)." }
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Commit validated foundation candidate
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) { throw 'No source changes produced by payload.' }
          git commit -m "CineCalendar 3.3.0: complete foundation"
          git push origin HEAD:foundation-3.3.0
