name: CineCalendar Windows Premium

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "feature/imdb-auto-sync"]
    paths-ignore:
      - "update-v2.json"
      - "collaborative-model.json"
      - ".github/workflows/bootstrap-migrate.yml"
      - ".github/workflows/als-model.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Premium source tree
        shell: pwsh
        run: |
          $required = @(
            'launcher.py',
            'cinecalendar\recommendation.py',
            'cinecalendar\recommender_v3.py',
            'cinecalendar\recommender_v10.py',
            'cinecalendar\recommender_v11.py',
            'cinecalendar\recommender_v12.py',
            'cinecalendar\recommender_v13.py',
            'cinecalendar\recommender_v14.py',
            'cinecalendar\recommender_v15.py',
            'cinecalendar\recommender_v16.py',
            'cinecalendar\hybrid_calibration_v46.py',
            'cinecalendar\quality_manager_v46.py',
            'cinecalendar\recalibration_policy_v47.py',
            'cinecalendar\recommendation_guard_v47.py',
            'cinecalendar\quality_manager_v47.py',
            'cinecalendar\candidate_metadata_v48.py',
            'cinecalendar\reliability_gate_v412.py',
            'cinecalendar\full_catalog_shadow_v413.py',
            'cinecalendar\full_catalog_shadow_v414.py',
            'cinecalendar\full_catalog_evaluation_v414.py',
            'cinecalendar\rolling_backtest_v37.py',
            'cinecalendar\adaptive_preferences_v2.py',
            'cinecalendar\personal_candidates.py',
            'cinecalendar\recommendation_backtest.py',
            'cinecalendar\temp_workspaces.py',
            'cinecalendar\collaborative_als.py',
            'cinecalendar\daily_genre_ui_patch.py',
            'collaborative-model.json',
            'MOVIELENS_MODEL_NOTICE.txt',
            'cinecalendar\autoseed.py',
            'cinecalendar\qt_ui_v2.py',
            'cinecalendar\premium_ui.py',
            'cinecalendar\open_metadata.py',
            'cinecalendar\updater.py',
            'scripts\benchmark_engine_v3.py',
            'scripts\evaluate_full_catalog_v414.py',
            'scripts\benchmark_v431.py',
            'scripts\backtest_recommendations.py',
            'UPDATE_NOTES.txt'
          )
          foreach ($p in $required) { if (!(Test-Path $p)) { throw "Missing Premium source: $p" } }

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Gate live IMDb public profile sync
        env:
          PYTHONPATH: .
        shell: pwsh
        run: |
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            python -c "from cinecalendar.imdb_sync import fetch_public_ratings,DEFAULT_PROFILE_URL; rows=fetch_public_ratings(DEFAULT_PROFILE_URL,timeout=20); print('LIVE_IMDB_RATINGS',len(rows)); assert len(rows) >= 2000, len(rows)"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "IMDb live gate attempt $attempt failed."
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $ok) { throw "IMDb public-profile live gate failed after 3 attempts." }
          python -c "import requests; from cinecalendar.imdb_sync import _metadata_payload; p=_metadata_payload(requests.Session(),['tt0111161'],timeout=20); t=(p.get('data') or {}).get('titles') or []; assert t and t[0].get('ratingsSummary'), p; print('LIVE_IMDB_METADATA_OK',t[0]['id'],t[0]['ratingsSummary'].get('aggregateRating'))"

      - name: Benchmark 260k catalog engine
        env:
          PYTHONPATH: .
        run: python scripts/benchmark_engine_v3.py

      - name: Benchmark 4.3.1 history and learning cache
        env:
          PYTHONPATH: .
        run: python scripts/benchmark_v431.py

      - name: Package replay source bundle
        shell: pwsh
        run: |
          $model = 'cinecalendar-als-ml32m-v1.npz'
          Invoke-WebRequest -Uri 'https://github.com/AdyTZa619/CineCalendar/releases/download/cinecalendar-als-ml32m-v1/cinecalendar-als-ml32m-v1.npz' -OutFile $model
          $sha = (Get-FileHash $model -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne '39afb93e3d154a3ad4ef665f6cafaeb9ad0868818c8dd4eb660eba13a157a1c6') { throw "ALS model SHA mismatch: $sha" }
          $items = @('cinecalendar','scripts','collaborative-model.json','requirements.txt','requirements-dev.txt',$model)
          Compress-Archive -Path $items -DestinationPath 'CineCalendar-4.14.0-replay-source.zip' -Force

      - name: Build fast portable folder
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CineCalendar --manifest CineCalendar.manifest --hidden-import=sqlite3 --collect-all implicit launcher.py
          $exe = 'dist\CineCalendar\CineCalendar.exe'
          if (!(Test-Path $exe)) { throw 'Premium EXE was not created' }
          $b = [IO.File]::ReadAllBytes($exe)
          if ($b.Length -lt 2 -or $b[0] -ne 0x4D -or $b[1] -ne 0x5A) { throw 'Not a Windows PE executable' }
          if (!(Test-Path 'dist\CineCalendar\_internal')) { throw 'PyInstaller _internal folder missing' }
          Copy-Item 'MOVIELENS_MODEL_NOTICE.txt' 'dist\CineCalendar\MOVIELENS_MODEL_NOTICE.txt' -Force
          Write-Host "Launcher EXE bytes: $($b.Length)"
          Write-Host "Portable folder bytes: $((Get-ChildItem 'dist\CineCalendar' -Recurse -File | Measure-Object Length -Sum).Sum)"
          Get-FileHash $exe -Algorithm SHA256

      - name: Smoke launch Premium
        shell: pwsh
        run: |
          $env:CINECALENDAR_DATA_DIR = Join-Path $env:RUNNER_TEMP 'cinecalendar-smoke-data'
          $p = Start-Process -FilePath '.\dist\CineCalendar\CineCalendar.exe' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            if ($p.ExitCode -ne 0) { throw "Premium app exited with $($p.ExitCode)" }
          } else {
            Stop-Process -Id $p.Id -Force
          }

      - name: Package Premium portable build
        id: package
        shell: pwsh
        run: |
          $version = (python -c "from cinecalendar import __version__; print(__version__)").Trim()
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Version missing' }
          $readme = @"
          CineCalendar $version Premium

          PORNIRE: dublu-click CineCalendar.exe.
          Nu este necesar Python și nu se instalează nimic.
          IMPORTANT: păstrează CineCalendar.exe împreună cu folderul _internal și restul fișierelor din acest director.
          Datele personale sunt păstrate separat în CineCalendarData și NU sunt șterse la update.
          Motorul principal de recomandare este implicit ALS, antrenat pe MovieLens 32M. Modelul public (~20 MB) este descărcat o singură dată și verificat SHA-256; ratingurile IMDb rămân exclusiv local și sunt folosite pentru recalcularea profilului ALS.
          Filmele noi care nu există în MovieLens folosesc motorul personal de conținut ca fallback.
          Home folosește o poartă finală de încredere care cere mai multe semnale independente înainte de Top 3.
          După minimum 170 de ratinguri, raportul ALS/conținut poate fi calibrat local pe istoricul tău; 70/30 rămâne activ dacă nicio alternativă nu câștigă stabil.
          Recalibrarea nu este repornită de feedback contextual și așteaptă un lot relevant de ratinguri noi; formula activă este verificată pe rezultate reale și poate reveni automat la baseline dacă două semnale independente regresează.
          În Recomandări, până la 6 ținte cu impact sunt alese dintre 36 de finaliști; preflight-ul are buget total de timp, cache și fallback Wikimedia, iar TMDb selectează postere w500 română/engleză.
          Home arată un singur scor final și separă potrivirea de ușurința de pornire. TMDb preferă descrierea în română, arată sursa în Detalii, iar tokenul validat este activ imediat fără restart.
          După „L-am văzut”, CineCalendar așteaptă nota reală din profilul IMDb, o verifică automat și confirmă importul fără să ceară aceeași notă în aplicație.
          Lista finală de 12 este afișată o singură dată, permite alegerea directă și păstrează formula ALS/conținut completă în telemetrie. Protecția live se actualizează după alegeri, vizionări și ratinguri.
          Reliability Gate separă dovezile personale de precizia măsurată, afișează un interval al notei și confirmă o recomandare numai după minimum 30 de rezultate reale care trec pragurile MAE și ±1 punct.
          Full-catalog v4.14 caută inclusiv combinații de gust în umbră, măsoară separat rulările comparabile și nu permite promovarea din shadow live; replay-ul temporal offline verifică orice viitoare injecție fără să schimbe formula 70/30.
          Vezi MOVIELENS_MODEL_NOTICE.txt pentru sursă și condițiile de utilizare ale modelului derivat.
          Actualizările ulterioare se fac direct din aplicație: ZIP verificat SHA-256, staging, backup, health-check și rollback automat.
          "@
          $readme | Set-Content -Encoding utf8NoBOM 'dist\CineCalendar\README.txt'
          $zipName = "CineCalendar-$version-Premium-Windows-x64.zip"
          Compress-Archive -Path 'dist\CineCalendar\*' -DestinationPath $zipName -Force
          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "ZIP: $zipName"
          Write-Host "ZIP bytes: $((Get-Item $zipName).Length)"
          Write-Host "ZIP SHA-256: $sha"
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "zip_sha=$sha" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v7
        with:
          name: CineCalendar-${{ steps.package.outputs.version }}-Premium-Windows-x64
          path: |
            dist/CineCalendar/**
            ${{ steps.package.outputs.zip_name }}
            CineCalendar-4.14.0-replay-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish Stable bundle and updater manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          $current = (git rev-parse HEAD).Trim()
          $remote = (git rev-parse origin/main).Trim()
          if ($current -ne $remote) {
            $changed = @(git diff --name-only "$current..$remote")
            $blocking = @($changed | Where-Object { $_ -notin @('update-v2.json', 'collaborative-model.json') })
            if ($blocking.Count -gt 0) {
              Write-Host "A newer source commit exists ($remote); skip Stable publication from $current."
              Write-Host "Changed source paths: $($blocking -join ', ')"
              exit 0
            }
            Write-Host 'Only ignored manifest/model metadata changed while building; rebasing before publication.'
            git rebase origin/main
            $current = (git rev-parse HEAD).Trim()
          }

          $version = '${{ steps.package.outputs.version }}'
          $zipName = '${{ steps.package.outputs.zip_name }}'
          $sha = '${{ steps.package.outputs.zip_sha }}'
          $tag = "cinecalendar-v$version"
          $notes = (Get-Content 'UPDATE_NOTES.txt' -Raw).Trim()

          if (gh release view $tag --repo '${{ github.repository }}' 2>$null) {
            throw "Stable release $tag already exists. Bump CineCalendar __version__; same-version replacement is forbidden."
          }

          gh release create $tag --target $current --title "CineCalendar $version Premium" --notes $notes --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { throw "Failed to create Stable release $tag." }

          $uploaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            gh release upload $tag $zipName --clobber --repo '${{ github.repository }}'
            if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
            Write-Warning "Release asset upload attempt $attempt failed; retrying."
            Start-Sleep -Seconds (5 * $attempt)
          }

          $verifyDir = Join-Path $env:RUNNER_TEMP "cinecalendar-release-verify-$version"
          New-Item -ItemType Directory -Force -Path $verifyDir | Out-Null
          $downloaded = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Remove-Item -LiteralPath (Join-Path $verifyDir $zipName) -Force -ErrorAction SilentlyContinue
            gh release download $tag --pattern $zipName --dir $verifyDir --repo '${{ github.repository }}'
            if ($LASTEXITCODE -eq 0 -and (Test-Path (Join-Path $verifyDir $zipName))) { $downloaded = $true; break }
            Write-Warning "Release verification download attempt $attempt failed; retrying."
            Start-Sleep -Seconds (5 * $attempt)
          }
          if (-not $uploaded -and -not $downloaded) {
            gh release delete $tag --yes --cleanup-tag --repo '${{ github.repository }}'
            throw "Failed to upload Stable asset $zipName after retries."
          }
          if (-not $downloaded) {
            gh release delete $tag --yes --cleanup-tag --repo '${{ github.repository }}'
            throw "Stable asset $zipName is not downloadable after publication."
          }
          $remoteSha = (Get-FileHash (Join-Path $verifyDir $zipName) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteSha -ne $sha) {
            gh release delete $tag --yes --cleanup-tag --repo '${{ github.repository }}'
            throw "Published ZIP SHA mismatch: expected $sha, got $remoteSha."
          }

          $releaseJson = gh release view $tag --json tagName,isDraft,isPrerelease,assets --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify Stable release $tag." }
          $release = $releaseJson | ConvertFrom-Json
          $asset = @($release.assets | Where-Object { $_.name -eq $zipName })
          if ($release.isDraft -or $release.isPrerelease -or $asset.Count -ne 1) {
            throw "Stable release verification failed for $tag / $zipName."
          }

          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/$zipName"
          $manifest = [ordered]@{
            version = $version
            url = $url
            sha256 = $sha
            notes = $notes
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
            channel = 'stable'
            package = 'onedir-zip'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8NoBOM 'update-v2.json'

          $verify = Get-Content 'update-v2.json' -Raw | ConvertFrom-Json
          if ($verify.version -ne $version) { throw 'Manifest version mismatch' }
          if ($verify.sha256 -ne $sha) { throw 'Manifest SHA mismatch' }
          if ($verify.url -ne $url) { throw 'Manifest URL mismatch' }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-v2.json
          git commit -m "Publish CineCalendar $version bundle updater manifest [skip ci]"
          git push origin HEAD:main
          Write-Host "Published CineCalendar $version standalone bundle, SHA-256 $sha"
