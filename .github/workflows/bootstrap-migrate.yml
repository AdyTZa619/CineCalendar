name: Bootstrap standalone CineCalendar

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap-migrate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import CineCalendar source from legacy branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          legacy="$RUNNER_TEMP/legacy-ddg"
          git clone --depth 1 --branch cinecalendar-direct-exe https://github.com/AdyTZa619/DuplicateDownloadGuard-Releases.git "$legacy"

          # Keep .github untouched in this commit. GitHub's workflow token is allowed to write
          # normal repository contents but not create/modify workflow files. Workflows are added
          # separately through the authorized GitHub integration after this source migration.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$legacy/CineCalendar/." .

          python - <<'PY'
          from pathlib import Path

          Path('cinecalendar/__init__.py').write_text('__version__ = "2.4.3"\n', encoding='utf-8')

          updater = Path('cinecalendar/updater.py')
          text = updater.read_text(encoding='utf-8')
          old = '''MANIFEST_URL = (\n    "https://raw.githubusercontent.com/AdyTZa619/"\n    "DuplicateDownloadGuard-Releases/cinecalendar-direct-exe/CineCalendar/update-v2.json"\n)'''
          new = '''MANIFEST_URL = (\n    "https://raw.githubusercontent.com/AdyTZa619/"\n    "CineCalendar/main/update-v2.json"\n)'''
          if old not in text:
              raise SystemExit('Legacy updater manifest URL not found')
          updater.write_text(text.replace(old, new), encoding='utf-8')

          model = Path('collaborative-model.json')
          text = model.read_text(encoding='utf-8').replace(
              'https://github.com/AdyTZa619/DuplicateDownloadGuard-Releases/releases/download/cinecalendar-als-ml32m-v1/cinecalendar-als-ml32m-v1.npz',
              'https://github.com/AdyTZa619/CineCalendar/releases/download/cinecalendar-als-ml32m-v1/cinecalendar-als-ml32m-v1.npz',
          )
          model.write_text(text, encoding='utf-8')

          Path('UPDATE_NOTES.txt').write_text(
              'CineCalendar 2.4.3 mută aplicația într-un repository GitHub dedicat: AdyTZa619/CineCalendar. '
              'Proiectul, buildurile Windows, release-urile, manifestul de update și modelul colaborativ nu mai sunt întreținute '
              'în repository-ul DuplicateDownloadGuard-Releases.\n\n'
              'Motorul de recomandare rămâne ALS MovieLens + profilul personal local, iar pagina «Ce văd acum?» recomandă automat '
              'fără să ceară alegerea unui gen. Selectorul de gen rămâne opțional pentru momentele în care utilizatorul vrea explicit ceva anume.\n\n'
              'Updaterul 2.4.3 și versiunile următoare citesc direct manifestul Stable din noul repository CineCalendar. '
              'Datele personale din CineCalendarData nu sunt mutate, șterse sau publicate.\n\n'
              'Rămân active protecția anti-văzut/rated, Program calendar precision-first, optimizările HDD, biblioteca completă de ratinguri, '
              'Taste Hub și updaterul cu staging, SHA-256, health-check și rollback.',
              encoding='utf-8',
          )

          readme = Path('README.md')
          if readme.exists():
              r = readme.read_text(encoding='utf-8')
              r = r.replace('DuplicateDownloadGuard-Releases', 'CineCalendar')
              r = r.replace('cinecalendar-direct-exe', 'main')
              readme.write_text(r, encoding='utf-8')
          PY

          # The trained ALS release was already copied to this repository by the first bootstrap
          # attempt. Verify it exists and never fall back to the DDG repository at runtime.
          gh release view cinecalendar-als-ml32m-v1 --repo AdyTZa619/CineCalendar >/dev/null

          # Stable 2.4.3 gets generated only by the Windows CI after tests + benchmark + smoke.
          rm -f update-v2.json update.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate CineCalendar source to standalone repository as 2.4.3'
          git push origin HEAD:main
